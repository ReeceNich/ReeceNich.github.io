flagship:
  title: "Problem Classification for Tailored Helpdesk Auto-replies"
  conference: "Presented at ICANN 2022 • 31st International Conference on Artificial Neural Networks (Bristol, UK)"
  summary: "Peer-reviewed research published as lead author and presented at ICANN 2022. Investigated neural network-driven natural language processing models to classify complex IT support tickets and generate context-tailored automated replies, reducing first-response latency in enterprise service desks."
  publication: "Springer Nature (LNCS Vol 13532)"
  doi: "10.1007/978-3-031-15937-4_37"
  tags:
    - "Neural Networks"
    - "Supervised Learning"
    - "NLP"
    - "Data Augmentation"
  link: "https://doi.org/10.1007/978-3-031-15937-4_37"
  cta_text: "Read Paper via Springer"
  image: "/assets/projects/ICANN.webp"
  image_alt: "Front cover of ICANN 2022 Proceedings featuring the research paper"

