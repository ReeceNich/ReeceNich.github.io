<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f19">

<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="author" content="Reece Nicholls">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<meta property="og:site_name" content="Reece Nicholls">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:type" content="website">
<meta property="og:locale" content="{{ site.locale | default: 'en_GB' }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:image" content="{{ site.url }}/assets/reece.jpg">
<meta property="og:image:width" content="1426">
<meta property="og:image:height" content="1426">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:alt" content="Portrait of Reece Nicholls">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ site.url }}/assets/reece.jpg">
<meta name="twitter:image:alt" content="Portrait of Reece Nicholls">

{% if page.robots %}
<meta name="robots" content="{{ page.robots }}">
{% endif %}

{% include seo-structured-data.html %}

<script>
  (function() {
    try {
      var stored = localStorage.getItem('theme');
      var validStored = stored === 'dark' || stored === 'light' ? stored : null;
      var systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      var theme = validStored || systemTheme;
      document.documentElement.setAttribute('data-bs-theme', theme);
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) { meta.setAttribute('content', theme); }
    } catch (e) {}
  })();
</script>

<link rel="preload" href="/lib/bootstrap.min.css" as="style">
<link rel="stylesheet" href="/lib/bootstrap.min.css">
<link rel="preload" href="/lib/bootstrap-icons/bootstrap-icons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="/lib/bootstrap-icons/bootstrap-icons.min.css"></noscript>
<link rel="stylesheet" href="/lib/style.css">
