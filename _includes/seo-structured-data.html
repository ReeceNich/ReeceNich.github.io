{% unless page.robots contains "noindex" %}
{% if page.url contains "privacy" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "{{ site.url }}{{ page.url }}#webpage",
      "url": "{{ site.url }}{{ page.url }}",
      "name": "{{ page.title }}",
      "description": "{{ page.description }}",
      "isPartOf": {
        "@type": "WebSite",
        "@id": "{{ site.url }}/#website",
        "url": "{{ site.url }}",
        "name": "Reece Nicholls"
      },
      "breadcrumb": {
        "@type": "BreadcrumbList",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "{{ site.url }}/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Privacy Statement",
            "item": "{{ site.url }}{{ page.url }}"
          }
        ]
      }
    }
  ]
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Person",
      "@id": "{{ site.url }}/#person",
      "name": "Reece Nicholls",
      "givenName": "Reece",
      "familyName": "Nicholls",
      "url": "{{ site.url }}/",
      "image": "{{ site.url }}/assets/reece.jpg",
      "jobTitle": "Full-Stack .NET & Software Engineer",
      "email": "mailto:{{ site.email | default: 'contact@reecenicholls.co.uk' }}",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "GB"
      },
      "worksFor": {
        "@type": "CollegeOrUniversity",
        "name": "University of the West of England (UWE Bristol)",
        "url": "https://www.uwe.ac.uk",
        "sameAs": "https://en.wikipedia.org/wiki/University_of_the_West_of_England"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "University of the West of England (UWE Bristol)",
        "url": "https://www.uwe.ac.uk",
        "sameAs": "https://en.wikipedia.org/wiki/University_of_the_West_of_England"
      },
      "hasCredential": {
        "@type": "EducationalOccupationalCredential",
        "credentialCategory": "degree",
        "name": "BSc (Hons) Business Computing",
        "recognizedBy": {
          "@type": "CollegeOrUniversity",
          "name": "University of the West of England (UWE Bristol)",
          "url": "https://www.uwe.ac.uk"
        }
      },
      "nationality": {
        "@type": "Country",
        "name": "United Kingdom"
      },
      "knowsAbout": [
        "C#",
        ".NET",
        "ASP.NET Core",
        "Microsoft Azure",
        "DevOps",
        "CI/CD Automation",
        "Cloud Architecture",
        "Artificial Intelligence",
        "Natural Language Processing",
        "Full-Stack Web Development"
      ],
      "sameAs": [
        "https://people.uwe.ac.uk/Person/ReeceNicholls",
        "https://www.linkedin.com/in/reece-nicholls/",
        "https://doi.org/10.1007/978-3-031-15937-4_37",
        "https://github.com/ReeceNich",
        "https://www.youtube.com/@reecenicholls"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{{ site.url }}/#website",
      "url": "{{ site.url }}/",
      "name": "Reece Nicholls",
      "description": "{{ site.description }}",
      "publisher": {
        "@id": "{{ site.url }}/#person"
      },
      "inLanguage": "en-GB"
    },
    {
      "@type": "ProfilePage",
      "@id": "{{ site.url }}/#webpage",
      "url": "{{ site.url }}/",
      "name": "{{ page.title | default: site.title }}",
      "isPartOf": {
        "@id": "{{ site.url }}/#website"
      },
      "primaryImageOfPage": {
        "@type": "ImageObject",
        "@id": "{{ site.url }}/#primaryimage",
        "url": "{{ site.url }}/assets/reece.jpg",
        "contentUrl": "{{ site.url }}/assets/reece.jpg",
        "caption": "Portrait of Reece Nicholls"
      },
      "image": "{{ site.url }}/assets/reece.jpg",
      "mainEntity": {
        "@id": "{{ site.url }}/#person"
      }
    },
    {
      "@type": "ScholarlyArticle",
      "@id": "https://doi.org/10.1007/978-3-031-15937-4_37",
      "headline": "{{ site.data.projects.flagship.title }}",
      "name": "{{ site.data.projects.flagship.title }}",
      "author": {
        "@id": "{{ site.url }}/#person"
      },
      "datePublished": "2022-09-07T00:00:00+01:00",
      "dateModified": "2022-09-07T00:00:00+01:00",
      "description": "{{ site.data.projects.flagship.summary }}",
      "url": "https://doi.org/10.1007/978-3-031-15937-4_37",
      "sameAs": "https://doi.org/10.1007/978-3-031-15937-4_37",
      "isPartOf": {
        "@type": "PublicationIssue",
        "name": "{{ site.data.projects.flagship.publication }}",
        "publisher": {
          "@type": "Organization",
          "name": "Springer Nature"
        }
      }
    }
  ]
}
</script>
{% endif %}
{% endunless %}
